<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Warm parchment background -->
  <rect width="32" height="32" rx="7" fill="#f5f1eb"/>

  <!-- Microphone body -->
  <rect x="12" y="4" width="8" height="13" rx="4" fill="#c8502a"/>

  <!-- Microphone grille lines (subtle) -->
  <line x1="12.5" y1="8.5"  x2="19.5" y2="8.5"  stroke="#f5e8e3" stroke-width="1" stroke-linecap="round"/>
  <line x1="12.5" y1="11"   x2="19.5" y2="11"    stroke="#f5e8e3" stroke-width="1" stroke-linecap="round"/>
  <line x1="12.5" y1="13.5" x2="19.5" y2="13.5"  stroke="#f5e8e3" stroke-width="1" stroke-linecap="round"/>

  <!-- Stand arc -->
  <path d="M8 14 Q8 22 16 22 Q24 22 24 14" fill="none" stroke="#1a1612" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Stand stem -->
  <line x1="16" y1="22" x2="16" y2="27" stroke="#1a1612" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="11" y1="27" x2="21" y2="27" stroke="#1a1612" stroke-width="2" stroke-linecap="round"/>
</svg>
