<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk to Text</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f5f1eb;
        --surface: #fffdf9;
        --ink: #1a1612;
        --ink-muted: #6b6560;
        --accent: #c8502a;
        --accent-light: #f5e8e3;
        --border: #e0d8cf;
        --radius: 12px;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        /* Tighter on mobile, spacious on desktop */
        padding: 24px 12px 60px;
      }
      @media (min-width: 480px) {
        body {
          padding: 40px 20px 80px;
        }
      }

      /* ── Header ── */
      header {
        max-width: 720px;
        margin: 0 auto 28px;
      }
      @media (min-width: 480px) {
        header {
          margin-bottom: 48px;
        }
      }
      .logo {
        font-family: "Instrument Serif", serif;
        font-size: clamp(1.6rem, 6vw, 2rem);
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      .logo span {
        color: var(--accent);
        font-style: italic;
      }
      .tagline {
        margin-top: 6px;
        font-size: clamp(0.8rem, 3.5vw, 0.9rem);
        color: var(--ink-muted);
        font-weight: 300;
        line-height: 1.4;
      }

      /* ── Card ── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        max-width: 720px;
        margin: 0 auto 20px;
      }
      @media (min-width: 480px) {
        .card {
          padding: 32px;
          margin-bottom: 24px;
        }
      }

      /* ── Upload Zone ── */
      .upload-zone {
        border: 2px dashed var(--border);
        border-radius: 10px;
        padding: 28px 16px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
        position: relative;
      }
      @media (min-width: 480px) {
        .upload-zone {
          padding: 40px 24px;
        }
      }
      .upload-zone:hover,
      .upload-zone.dragover {
        border-color: var(--accent);
        background: var(--accent-light);
      }
      .upload-zone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }
      .upload-icon {
        font-size: 2rem;
        margin-bottom: 10px;
        display: block;
      }
      .upload-zone p {
        font-size: clamp(0.8rem, 3vw, 0.95rem);
        color: var(--ink-muted);
        line-height: 1.5;
      }
      .upload-zone p + p {
        margin-top: 4px;
      }
      .upload-zone strong {
        color: var(--accent);
        font-weight: 500;
      }
      #fileName {
        margin-top: 10px;
        font-size: 0.85rem;
        color: var(--ink);
        font-weight: 500;
        word-break: break-all;
      }

      /* ── Buttons ── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: 8px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        border: none;
        transition:
          opacity 0.2s,
          transform 0.1s;
        white-space: nowrap;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        margin-top: 14px;
        width: 100%;
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .btn-secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--ink-muted);
        font-size: 0.82rem;
        padding: 7px 12px;
      }
      .btn-secondary:hover {
        border-color: var(--ink-muted);
        color: var(--ink);
      }

      /* ── Error ── */
      .error-box {
        display: none;
        background: #fdf0ed;
        border: 1px solid #f5c3b5;
        color: #9b2c10;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 0.9rem;
        margin-top: 14px;
        line-height: 1.5;
      }

      /* ── Progress ── */
      .progress-wrap {
        display: none;
        margin-top: 16px;
      }
      .progress-bar-bg {
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 2px;
        width: 0%;
        transition: width 0.4s ease;
      }
      .progress-label {
        font-size: 0.82rem;
        color: var(--ink-muted);
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot-loader span {
        display: inline-block;
        width: 5px;
        height: 5px;
        background: var(--accent);
        border-radius: 50%;
        animation: bounce 1.2s infinite ease-in-out;
      }
      .dot-loader span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot-loader span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-6px);
        }
      }

      /* ── Results ── */
      #results {
        display: none;
        max-width: 720px;
        margin: 0 auto;
      }

      /* Result header: title + action buttons.
         On very small screens, stack them vertically. */
      .result-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .result-title {
        font-family: "Instrument Serif", serif;
        font-size: clamp(1.05rem, 4vw, 1.3rem);
        letter-spacing: -0.01em;
      }
      .result-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .result-body {
        font-size: clamp(0.88rem, 3vw, 0.95rem);
        line-height: 1.75;
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ── Tabs ── */
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
        margin-bottom: 18px;
        /* Scrollable on very narrow screens */
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        padding: 10px 14px;
        font-size: clamp(0.82rem, 3vw, 0.9rem);
        font-weight: 500;
        cursor: pointer;
        color: var(--ink-muted);
        border-bottom: 2px solid transparent;
        transition:
          color 0.15s,
          border-color 0.15s;
        background: none;
        border-top: none;
        border-left: none;
        border-right: none;
        font-family: "DM Sans", sans-serif;
        margin-bottom: -1px;
        flex-shrink: 0;
      }
      .tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }

      /* ── Customizer ── */
      .customizer {
        margin-top: 12px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: none;
      }
      .customizer.open {
        display: block;
      }
      .customizer-grid {
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2-col on mobile */
        gap: 12px;
        margin-top: 12px;
      }
      @media (min-width: 480px) {
        .customizer-grid {
          grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        }
      }
      .customizer label {
        font-size: 0.75rem;
        color: var(--ink-muted);
        display: block;
        margin-bottom: 4px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .customizer input[type="number"],
      .customizer select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        background: var(--surface);
        color: var(--ink);
      }
      .customizer input[type="color"] {
        width: 100%;
        height: 38px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px;
        cursor: pointer;
        background: var(--surface);
      }
      .customizer-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

      /* ── Fade-in ── */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card.animate {
        animation: fadeUp 0.4s ease forwards;
      }
      .card.animate:nth-child(2) {
        animation-delay: 0.1s;
      }
      .card.animate:nth-child(3) {
        animation-delay: 0.2s;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">Talk<span>to</span>Text</div>
      <p class="tagline">
        Upload a lecture recording — get an instant summary &amp; key points.
      </p>
    </header>

    <!-- Upload Card -->
    <div class="card" id="uploadCard">
      <div class="upload-zone" id="dropZone">
        <input type="file" id="audioFile" accept="audio/*" />
        <span class="upload-icon">🎙️</span>
        <p><strong>Choose a file</strong> or drag &amp; drop it here</p>
        <p>MP3, WAV, M4A, OGG, FLAC — up to 100MB</p>
        <div id="fileName"></div>
      </div>

      <div class="error-box" id="errorBox"></div>

      <button class="btn btn-primary" id="processBtn" disabled>
        Process Recording
      </button>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-label">
          <span class="dot-loader"
            ><span></span><span></span><span></span
          ></span>
          <span id="progressLabel">Uploading…</span>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="results">
      <div class="card animate">
        <div class="tabs">
          <button class="tab active" data-tab="summary">Summary</button>
          <button class="tab" data-tab="keypoints">Key Points</button>
          <button class="tab" data-tab="transcript">Transcript</button>
        </div>

        <div class="tab-panel active" id="tab-summary">
          <div class="result-header">
            <div class="result-title">Abstract Summary</div>
            <div class="result-actions">
              <button
                class="btn btn-secondary"
                onclick="copyText('abstractSummary')"
              >
                Copy
              </button>
              <button
                class="btn btn-secondary"
                onclick="downloadText('abstractSummary', 'summary.txt')"
              >
                Download
              </button>
            </div>
          </div>
          <p class="result-body" id="abstractSummary"></p>
        </div>

        <div class="tab-panel" id="tab-keypoints">
          <div class="result-header">
            <div class="result-title">Key Points</div>
            <div class="result-actions">
              <button class="btn btn-secondary" onclick="copyText('keyPoints')">
                Copy
              </button>
              <button
                class="btn btn-secondary"
                onclick="downloadText('keyPoints', 'key-points.txt')"
              >
                Download
              </button>
            </div>
          </div>
          <p class="result-body" id="keyPoints"></p>
        </div>

        <div class="tab-panel" id="tab-transcript">
          <div class="result-header">
            <div class="result-title">Full Transcript</div>
            <div class="result-actions">
              <button
                class="btn btn-secondary"
                onclick="copyText('transcript')"
              >
                Copy
              </button>
              <button
                class="btn btn-secondary"
                onclick="downloadText('transcript', 'transcript.txt')"
              >
                Download
              </button>
            </div>
          </div>
          <p class="result-body" id="transcript"></p>
        </div>

        <!-- Font Customizer -->
        <div style="margin-top: 20px">
          <button class="btn btn-secondary" id="toggleCustomizer">
            ⚙ Adjust Appearance
          </button>
        </div>
        <div class="customizer" id="customizer">
          <div class="customizer-grid">
            <div>
              <label>Font Size (px)</label>
              <input type="number" id="fontSize" value="16" min="10" max="36" />
            </div>
            <div>
              <label>Font Family</label>
              <select id="fontFamily">
                <option value="'DM Sans', sans-serif">DM Sans</option>
                <option value="'Instrument Serif', serif">
                  Instrument Serif
                </option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="Verdana, sans-serif">Verdana</option>
              </select>
            </div>
            <div>
              <label>Letter Spacing (px)</label>
              <input
                type="number"
                id="letterSpacing"
                value="0"
                min="-2"
                max="10"
              />
            </div>
            <div>
              <label>Text Color</label>
              <input type="color" id="fontColor" value="#1a1612" />
            </div>
            <div>
              <label>Background Color</label>
              <input type="color" id="bgColor" value="#f5f1eb" />
            </div>
          </div>
          <div class="customizer-actions">
            <button
              class="btn btn-primary"
              style="width: auto"
              id="applyStyles"
            >
              Apply
            </button>
            <button class="btn btn-secondary" id="resetStyles">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const dropZone = document.getElementById("dropZone");
      const audioFile = document.getElementById("audioFile");
      const processBtn = document.getElementById("processBtn");
      const fileNameEl = document.getElementById("fileName");

      audioFile.addEventListener("change", () => {
        if (audioFile.files[0]) {
          fileNameEl.textContent = "📎 " + audioFile.files[0].name;
          processBtn.disabled = false;
        }
      });

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });
      dropZone.addEventListener("dragleave", () =>
        dropZone.classList.remove("dragover"),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        const file = e.dataTransfer.files[0];
        if (file) {
          audioFile.files = e.dataTransfer.files;
          fileNameEl.textContent = "📎 " + file.name;
          processBtn.disabled = false;
        }
      });

      let progressInterval;
      function startProgress() {
        const bar = document.getElementById("progressBar");
        const label = document.getElementById("progressLabel");
        const steps = [
          { pct: 20, text: "Uploading audio…" },
          { pct: 45, text: "Transcribing with Whisper…" },
          { pct: 70, text: "Generating summary…" },
          { pct: 90, text: "Extracting key points…" },
        ];
        let i = 0;
        bar.style.width = "5%";
        progressInterval = setInterval(() => {
          if (i < steps.length) {
            bar.style.width = steps[i].pct + "%";
            label.textContent = steps[i].text;
            i++;
          }
        }, 2500);
      }
      function finishProgress() {
        clearInterval(progressInterval);
        document.getElementById("progressBar").style.width = "100%";
        document.getElementById("progressLabel").textContent = "Done!";
        setTimeout(() => {
          document.getElementById("progressWrap").style.display = "none";
        }, 600);
      }

      processBtn.addEventListener("click", async () => {
        const file = audioFile.files[0];
        if (!file) return;

        const errorBox = document.getElementById("errorBox");
        errorBox.style.display = "none";
        processBtn.disabled = true;
        processBtn.textContent = "Processing…";
        document.getElementById("progressWrap").style.display = "block";
        document.getElementById("results").style.display = "none";
        startProgress();

        const formData = new FormData();
        formData.append("audio", file);

        try {
          const response = await fetch(
            "http://127.0.0.1:8000/generate-summary",
            {
              method: "POST",
              body: formData,
            },
          );
          const result = await response.json();

          if (response.ok) {
            document.getElementById("abstractSummary").textContent =
              result.abstract_summary;
            document.getElementById("keyPoints").textContent =
              result.key_points;
            document.getElementById("transcript").textContent =
              result.transcript || "(Transcript not available)";
            finishProgress();
            document.getElementById("results").style.display = "block";
            document
              .getElementById("results")
              .scrollIntoView({ behavior: "smooth", block: "start" });
          } else {
            throw new Error(result.error || "An unknown error occurred.");
          }
        } catch (err) {
          clearInterval(progressInterval);
          document.getElementById("progressWrap").style.display = "none";
          errorBox.textContent = "⚠ " + err.message;
          errorBox.style.display = "block";
        } finally {
          processBtn.disabled = false;
          processBtn.textContent = "Process Recording";
        }
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.remove("active"));
          document
            .querySelectorAll(".tab-panel")
            .forEach((p) => p.classList.remove("active"));
          tab.classList.add("active");
          document
            .getElementById("tab-" + tab.dataset.tab)
            .classList.add("active");
        });
      });

      function copyText(id) {
        const text = document.getElementById(id).textContent;
        navigator.clipboard.writeText(text).then(() => {
          const btn = event.target;
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = "Copy"), 2000);
        });
      }
      function downloadText(id, filename) {
        const text = document.getElementById(id).textContent;
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
        a.download = filename;
        a.click();
      }

      document
        .getElementById("toggleCustomizer")
        .addEventListener("click", () => {
          document.getElementById("customizer").classList.toggle("open");
        });

      const resultBodies = () => document.querySelectorAll(".result-body");

      document.getElementById("applyStyles").addEventListener("click", () => {
        const fontSize = document.getElementById("fontSize").value + "px";
        const fontColor = document.getElementById("fontColor").value;
        const fontFamily = document.getElementById("fontFamily").value;
        const letterSpacing =
          document.getElementById("letterSpacing").value + "px";
        const bgColor = document.getElementById("bgColor").value;
        document.body.style.backgroundColor = bgColor;
        resultBodies().forEach((el) => {
          el.style.fontSize = fontSize;
          el.style.color = fontColor;
          el.style.fontFamily = fontFamily;
          el.style.letterSpacing = letterSpacing;
        });
      });

      document.getElementById("resetStyles").addEventListener("click", () => {
        document.body.style.backgroundColor = "";
        resultBodies().forEach((el) => {
          el.style.cssText = "";
        });
        document.getElementById("fontSize").value = 16;
        document.getElementById("fontColor").value = "#1a1612";
        document.getElementById("fontFamily").value = "'DM Sans', sans-serif";
        document.getElementById("letterSpacing").value = 0;
        document.getElementById("bgColor").value = "#f5f1eb";
      });
    </script>
  </body>
</html>
